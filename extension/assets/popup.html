<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Pitch Changer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }

      body {
        width: 320px;
        min-height: 100px;
        padding: 12px 12px 8px 12px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .status {
        background: #ffcdd2;
        padding: 6px;
        color: #a91919;
        border: 1px solid #ef9a9a;
        border-radius: 8px;
        user-select: text;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .title {
        font-size: 14px;
        font-weight: bold;
      }

      .toggle {
        position: relative;
        width: 38px;
        height: 18px;
      }

      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider-toggle {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.1s;
        border-radius: 24px;
      }

      .slider-toggle:before {
        position: absolute;
        content: '';
        height: 12px;
        width: 12px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.1s;
        border-radius: 50%;
      }

      input:checked + .slider-toggle {
        background-color: #039be5;
      }

      input:checked + .slider-toggle:before {
        transform: translateX(20px);
      }

      #pitchValue {
        font-size: 20px;
        font-weight: bold;
      }

      #noteValue {
        font-size: 14px;
        color: #666;
      }

      #pitchHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        margin-top: 8px;
      }

      #pitchSliderContainer {
        width: 100%;
        margin: 8px 0;
      }

      #pitchSlider {
        width: 100%;
        height: 6px;
        -webkit-appearance: none;
        appearance: none;
        background: #ddd;
        border-radius: 3px;
        outline: none;
      }

      #pitchSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #0277bd;
        cursor: pointer;
        border: 2px solid white;
      }

      #pitchSlider.disabled::-webkit-slider-thumb {
        background: #aaa;
      }

      #pitchSlider:hover::-webkit-slider-thumb {
        background: #039be5;
      }

      #pitchSlider:hover.disabled::-webkit-slider-thumb {
        background: #bbb;
      }

      #pitchSlider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #0277bd;
        cursor: pointer;
        border: 2px solid white;
      }

      #pitchSlider.disabled::-moz-range-thumb {
        background: #aaa;
      }

      #pitchSlider:hover::-moz-range-thumb {
        background: #039be5;
      }

      #pitchSlider:hover.disabled::-moz-range-thumb {
        background: #bbb;
      }

      #pitchSliderLabels {
        display: flex;
        justify-content: space-between;
        margin-top: 4px;
        font-size: 12px;
        color: #666;
      }

      .segmented {
        display: flex;
      }

      .segmented button {
        border: 1px solid #bbb;
        background: transparent;
        cursor: pointer;
        text-align: center;
      }

      .segmented button:first-child {
        border-radius: var(--segmented-radius, 8px) 0 0 var(--segmented-radius, 8px);
      }

      .segmented button + button {
        margin-left: -1px;
      }

      .segmented button:last-child {
        border-radius: 0 var(--segmented-radius, 8px) var(--segmented-radius, 8px) 0;
      }

      .segmented button:hover {
        background-color: rgba(0, 0, 0, 0.05);
      }

      .segmented button.active {
        z-index: 1;
        border-color: #039be5;
        background: #039be5;
        color: #fff;
      }

      .segmented button.active.disabled {
        border-color: #999;
        background: #999;
        color: #fff;
      }

      #modeSelector {
        margin-top: 12px;
      }

      #modeSelector button {
        flex: 1;
        padding: 6px;
        font-size: 14px;
      }

      #advancedSection {
        font-size: 12px;
      }

      #advancedSection summary {
        font-weight: bold;
        cursor: pointer;
        padding: 8px 0;
      }

      .checkbox-row {
        margin-top: 8px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .checkbox-row input[type='checkbox'] {
        width: 14px;
        height: 14px;
        cursor: pointer;
        accent-color: #039be5;
      }

      .checkbox-row label {
        cursor: pointer;
      }

      .checkbox-row input[type='checkbox'].disabled {
        accent-color: #888;
      }

      .num-elements {
        margin-left: 4px;
        user-select: text;
      }

      #latencyRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      #latencySelector button {
        padding: 4px 12px;
        font-size: 12px;
        --segmented-radius: 6px;
      }
    </style>
    <script src="popup.js" type="module"></script>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <div class="title">Audio Pitch Changer</div>
        <label class="toggle">
          <input type="checkbox" id="toggleEnabled" checked />
          <span class="slider-toggle"></span>
        </label>
      </div>

      <div>
        <div id="pitchHeader">
          <div id="pitchValue">1.0x</div>
          <div id="noteValue">A4 → A4</div>
        </div>

        <div id="pitchSliderContainer">
          <input type="range" id="pitchSlider" min="0.5" max="2.0" step="0.02" value="1.0" />
          <div id="pitchSliderLabels">
            <span>0.5x</span>
            <span>2.0x</span>
          </div>
        </div>

        <div id="modeSelector" class="segmented">
          <button class="active" data-mode="pitch">Pitch</button>
          <button data-mode="formant-preserving-pitch">Speech Pitch</button>
        </div>
      </div>

      <div class="status" id="status" hidden></div>

      <div>
        <details id="advancedSection">
          <summary>Advanced</summary>
          <div id="latencyRow">
            <span>Latency:</span>
            <div id="latencySelector" class="segmented">
              <button class="active" id="latencyNormal" data-latency="normal">Normal</button>
              <button id="latencyHigh" data-latency="high">High</button>
            </div>
          </div>
          <div id="passthroughCheckbox" class="checkbox-row">
            <input type="checkbox" id="enablePassthroughOptimization" checked />
            <label for="enablePassthroughOptimization">Enable passthrough optimization</label>
          </div>
          <div id="debugCheckbox" class="checkbox-row">
            <input type="checkbox" id="debugLogging" />
            <label for="debugLogging">Enable debug logging</label>
          </div>
          <div><span>Number of audio elements:</span><span id="numAudioElements" class="num-elements"></span></div>
          <div><span>Number of video elements:</span><span id="numVideoElements" class="num-elements"></span></div>
          <div>
            <span>Number of AudioContexts:</span><span id="numAudioContextDestinations" class="num-elements"></span>
          </div>
          <div><span>Fast path active:</span><span id="fastPathActive" class="num-elements"></span></div>
          <div><span>Current latency (ms):</span><span id="maxCurrentLatencyMs" class="num-elements"></span></div>
          <div><span>Number of underruns:</span><span id="numUnderruns" class="num-elements"></span></div>
          <div><span>Queue length (samples):</span><span id="maxQueueLength" class="num-elements"></span></div>
        </details>
      </div>
    </div>
  </body>
</html>
